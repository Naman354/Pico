<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="desktop-stage">
    <!-- Tiny Pico Character (~60px) resting on the taskbar ledge -->
    <div id="pico-container">
      <div id="pico-facer" class="pico-facer facing-right">
        <div id="pico-figure" class="pico-figure idle">
          <!-- Front-facing Idle Stance & Attention Shift Rig -->
          <div id="pico-body" class="pico-body">
            <img class="pico-character body-frame" src="pico-idle.png" alt="" draggable="false" />
          </div>

          <div id="pico-head" class="pico-head">
            <img id="pico-character" class="pico-character front-idle" src="pico-idle.png" alt="Pico" draggable="false" />
            <!-- Eye Gaze Overlays -->
            <img id="pico-eyes-left" class="pico-character eye-overlay eyes-left" src="pico-eyes-left.png" alt="" draggable="false" />
            <img id="pico-eyes-right" class="pico-character eye-overlay eyes-right" src="pico-eyes-right.png" alt="" draggable="false" />
            <img id="pico-eyes-down" class="pico-character eye-overlay eyes-down" src="pico-eyes-down.png" alt="" draggable="false" />
            <!-- Eyelid Blink Overlay -->
            <img id="pico-blink" class="pico-character blink-overlay" src="pico-blink.png" alt="" draggable="false" />
          </div>

          <!-- Side-facing Walking Stance & Alternating Step Frames -->
          <img id="pico-side-stand" class="pico-character side-frame side-stand" src="pico-side-stand.png" alt="" draggable="false" />
          <img id="pico-side-walk1" class="pico-character side-frame side-walk-1" src="pico-side-walk-1.png" alt="" draggable="false" />
          <img id="pico-side-walk2" class="pico-character side-frame side-walk-2" src="pico-side-walk-2.png" alt="" draggable="false" />
        </div>
      </div>
    </div>

    <!-- Attached Speech Bubble -->
    <div id="bubble-container">
      <!-- Tail pointing directly to Pico -->
      <svg class="bubble-tail" viewBox="0 0 8 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 0 6 L 8 0 L 8 12 Z" fill="#FFFFFF" />
        <path d="M 8 0 L 0 6 L 8 12" stroke="#E2DDD5" stroke-width="1" fill="none" />
      </svg>

      <!-- Text input attached to Pico -->
      <input 
        id="pico-input" 
        type="text" 
        placeholder="Type to Pico..." 
        autocomplete="off" 
        spellcheck="false"
      />

      <!-- Action / Send Button -->
      <button id="send-btn" aria-label="Send to Pico" title="Send">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>
    </div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
