<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pico Walking Motion Test</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      overflow: hidden;
    }
    h2 { margin-bottom: 8px; }
    p { margin-top: 0; color: #94a3b8; font-size: 14px; }
    .stage {
      position: relative;
      width: 800px;
      height: 120px;
      background: #1e293b;
      border-bottom: 2px solid #38bdf8;
      margin-top: 20px;
      overflow: hidden;
    }
    .taskbar-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid #475569;
    }
    #pico-runner {
      position: absolute;
      bottom: 30px; /* Feet exactly on taskbar line */
      left: 0;
      width: 38px;
      height: 60px;
      transform-origin: center bottom;
    }
    #pico-sprite {
      width: 38px;
      height: 60px;
      display: block;
      transform-origin: center bottom;
    }
    .info {
      margin-top: 15px;
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h2>Pico Walk Cycle Interactive Sandbox</h2>
  <p>Testing footstep rhythm, foot planting/lifting, weight transfer, and subtle vertical body movement at 60px scale.</p>

  <div class="stage">
    <div id="pico-runner">
      <img id="pico-sprite" src="src/renderer/pico-side-stand.png" />
    </div>
    <div class="taskbar-line"></div>
  </div>

  <div class="info" id="status">Initializing...</div>

  <script>
    const runner = document.getElementById('pico-runner');
    const sprite = document.getElementById('pico-sprite');
    const status = document.getElementById('status');

    const frames = [
      'src/renderer/pico-side-stand.png',
      'src/renderer/pico-side-walk-1.png',
      'src/renderer/pico-side-stand.png',
      'src/renderer/pico-side-walk-2.png'
    ];

    // Preload
    frames.forEach(src => { const img = new Image(); img.src = src; });

    let x = 60;
    let dir = 1;
    let accumulatedDist = 0;
    let lastTime = performance.now();

    // Step Stride: 1 step per ~12px of translation
    // 4 phases per 2-step cycle (pass -> step1 -> pass -> step2)
    const stepStride = 12; // 12px per step, 24px full 2-step cycle
    let lastPhase = -1;

    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      // Casual walking speed ~32 px/s
      // With non-linear velocity pulse per step:
      // Slower during plant (weight transfer), faster during push
      const phaseNorm = (accumulatedDist % (stepStride * 2)) / (stepStride * 2);
      // 2 pulses per full cycle (one per step)
      const stepT = (accumulatedDist % stepStride) / stepStride;
      const speedMod = 1.0 - 0.28 * Math.cos(2 * Math.PI * stepT);
      const currentSpeed = 32 * speedMod;

      const move = currentSpeed * dt;
      x += move * dir;
      accumulatedDist += move;

      if (x > 700) {
        dir = -1;
        runner.style.transform = 'scaleX(-1)';
      } else if (x < 60) {
        dir = 1;
        runner.style.transform = 'scaleX(1)';
      }

      runner.style.left = Math.round(x) + 'px';

      // Phase calculation
      const phase = Math.floor(accumulatedDist / (stepStride / 2)) % 4;
      if (phase !== lastPhase) {
        lastPhase = phase;
        sprite.src = frames[phase];
      }

      // Vertical body movement & subtle weight shift:
      // When passing (phase 0 & 2): body reaches full height 1.0
      // When stepping / landing (phase 1 & 3): body settles slightly scaleY(0.978) + tiny forward tilt
      const isStepping = (phase === 1 || phase === 3);
      if (isStepping) {
        sprite.style.transform = 'scaleY(0.978) skewX(-0.5deg)';
      } else {
        sprite.style.transform = 'scaleY(1.0) skewX(-0.1deg)';
      }

      status.textContent = `X: ${x.toFixed(1)}px | Speed: ${currentSpeed.toFixed(1)}px/s | Phase: ${phase} (${['Pass L', 'Step 1', 'Pass R', 'Step 2'][phase]})`;

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
